{{define "content"}}
<section>
    <h2>Kitap Listesi</h2>

    <p>
        <a href="/web/books/new">Yeni Kitap Ekle</a>
    </p>

    <ul>
        {{range .Books}}
        <li>{{.ID}} - {{.Title}} - {{.Author}} ({{.Year}})</li>
        {{else}}
        <li>Henüz kitap yok.</li>
        {{end}}
    </ul>
</section>
{{end}}
