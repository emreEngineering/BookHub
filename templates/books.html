{{define "content"}}
<section>
    <h2>Kitap Listesi</h2>

    <p>
        <a href="/web/books/new">Yeni Kitap Ekle</a>
    </p>

    <ul>
        {{range .Books}}
        <li>
            {{.ID}} - {{.Title}} - {{.Author}} ({{.Year}})

            <a href="/web/books/edit?id={{.ID}}" class="edit-link">Düzenle</a>

            <form method="post" action="/web/books/delete?id={{.ID}}" class="inline-form">
                <button type="submit" class="danger-button">Sil</button>
            </form>
        </li>
        {{else}}
        <li>Henüz kitap yok.</li>
        {{end}}
    </ul>
</section>
{{end}}
